<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта Надвірної</title>

  <!-- Підключаємо Leaflet: стилі й сам скрипт -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100%; }
    .district-label {
  font-size: 28px;
  font-weight: bold;
  color: ##8B0000;
  text-shadow: 1px 1px 2px white, -1px -1px 2px white;
  text-align: center;
}
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // 1. Створюємо карту й центруємо її на Надвірній
    var map = L.map('map').setView([48.6333, 24.5833], 14);
    // Звичайна карта
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; учасники OpenStreetMap'
});

// Супутник (знімки Esri)
var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Знімки &copy; Esri'
});

// Показуємо звичайну карту при відкритті
osm.addTo(map);

// Кнопка-перемикач у правому верхньому куті
L.control.layers({
  'Карта': osm,
  'Супутник': satellite
}).addTo(map);

    // 2. Підкладка з картою OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; учасники OpenStreetMap'
    }).addTo(map);

    L.marker([48.64806241374767, 24.588595111519023], {
  icon: L.divIcon({
    className: 'district-label',
    html: 'Річки',
    iconSize: [100, 30]
  }),
  interactive: false
}).addTo(map);
  </script>
</body>
</html>

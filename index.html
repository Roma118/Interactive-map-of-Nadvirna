<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Надвірної</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body { margin: 0; font-family: sans-serif; }
  #map { height: 100vh; width: 100%; }

  .street-sign {
    width: 18px;
    height: 11px;
    background: #1E50A0;
    border: 2px solid white;
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    cursor: pointer;
  }

  .photo-icon img {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    cursor: pointer;
  }

  .leaflet-popup-content { font-size: 18px; }

  .district-label::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 100px;
    transform: translate(-50%, -50%);
    background: #F0DC82;
    border-radius: 50%;
    filter: blur(20px);
    z-index: -1;
  }

  .district-label {
    font-size: 28px;
    font-weight: bold;
    color: #8B0000;
    text-shadow: 0 0 4px #F0DC82, 0 0 8px #F0DC82, 0 0 120px #F0DC82, 0 0 6px #F0DC82, 0 0 12px #F0DC82, 0 0 20px #F0DC82, 0 0 200px #F0DC82;
    text-align: center;
  }

  .rivers span { transform: rotate(-20deg); }

  #coords-box {
    position: absolute;
    left: 10px;
    bottom: 30px;
    z-index: 1000;
    background: white;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 16px;
    user-select: all;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="coords-box">Клікни на мапі, щоб побачити координати</div>

  var map = L.map('map', {
    maxBounds: [[48.60419836040843, 24.530568289659303], [48.66336565863335, 24.62824772042684]],
    maxBoundsViscosity: 1.0,
    minZoom: 12
  }).setView([48.6333, 24.5833], 14);

    maxZoom: 19,

    maxZoom: 19,
    attribution: 'Знімки &copy; Esri'
  });

  osm.addTo(map);
  L.control.layers({ 'Карта': osm, 'Супутник': satellite }).addTo(map);

  map.on('click', function (e) {
    document.getElementById('coords-box').textContent =

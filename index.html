<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Надвірної</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body { margin: 0; font-family: sans-serif; }
  #map { height: 100vh; width: 100%; }

  /* Скляна шпилька: прозорий видовжений трикутник вістрям вниз */
  .pin-wrap {
    position: relative;
    width: 28px;
    height: 42px;
  }
  .pin-shadow {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 20px;
    height: 7px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 70%);
    filter: blur(1px);
  }
  .pin-glass {
    position: absolute;
    left: 0;
    top: 0;
    width: 28px;
    height: 38px;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: rgba(255,255,255,0.10);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .pin-outline {
    position: absolute;
    left: 0;
    top: 0;
    width: 28px;
    height: 38px;
    pointer-events: none;
  }

  .photo-icon img {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    cursor: pointer;
  }

  .leaflet-popup-content { font-size: 18px; }

  .road-label {
    background: none;
    border: none;
    box-shadow: none;
    color: #555;
    font-size: 12px;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    padding: 0;
  }
  .road-label::before { display: none; }
  #base-status {
    position: absolute;
    right: 10px;
    bottom: 30px;
    z-index: 1000;
    background: white;
    border: 1px solid #999;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 14px;
    display: none;
  }

  .district-label::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 100px;
    transform: translate(-50%, -50%);
    background: #F0DC82;
    border-radius: 50%;
    filter: blur(20px);
    z-index: -1;
  }

  .district-label {
    font-size: 28px;
    font-weight: bold;
    color: #8B0000;
    text-shadow: 0 0 4px #F0DC82, 0 0 8px #F0DC82, 0 0 120px #F0DC82, 0 0 6px #F0DC82, 0 0 12px #F0DC82, 0 0 20px #F0DC82, 0 0 200px #F0DC82;
    text-align: center;
  }

  .rivers span { transform: rotate(-20deg); }

  #coords-box {
    position: absolute;
    left: 10px;
    bottom: 30px;
    z-index: 1000;
    background: white;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 16px;
    user-select: all;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="coords-box">Клікни на мапі, щоб побачити координати</div>

<script>
  var map = L.map('map', {
    maxBounds: [[48.60419836040843, 24.530568289659303], [48.66336565863335, 24.62824772042684]],
    maxBoundsViscosity: 1.0,
    minZoom: 12
  }).setView([48.6333, 24.5833], 14);

  // Окремі шари: райони нижче, шпильки вулиць вище
  map.createPane('districtsPane');
  map.getPane('districtsPane').style.zIndex = 450;
  map.createPane('streetsPane');
  map.getPane('streetsPane').style.zIndex = 650;

  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; учасники OpenStreetMap'
  });

  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Знімки &copy; Esri'
  });

  // ===== Власна підкладка: вулиці, річки, зелень з OpenStreetMap, без будівель =====
  map.createPane('basePane');
  map.getPane('basePane').style.zIndex = 250;
  var baseCanvas = L.canvas({ pane: 'basePane', padding: 0.5 });
  map.createPane('roadLabelsPane');
  map.getPane('roadLabelsPane').style.zIndex = 300;
  map.getPane('roadLabelsPane').style.pointerEvents = 'none';

  var customBase = L.layerGroup();
  var customLoaded = false;
  var statusBox = document.createElement('div');
  statusBox.id = 'base-status';
  document.body.appendChild(statusBox);

  var overpassServers = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  var overpassQuery =
    '[out:json][timeout:60];(' +
    'way["highway"]["highway"!~"^(footway|steps|corridor|bus_guideway|proposed|construction)$"](48.6042,24.5306,48.6634,24.6283);' +
    'way["waterway"~"^(river|stream|canal)$"](48.6042,24.5306,48.6634,24.6283);' +
    'way["natural"~"^(water|wood)$"](48.6042,24.5306,48.6634,24.6283);' +
    'way["landuse"~"^(forest|meadow|grass|cemetery|recreation_ground)$"](48.6042,24.5306,48.6634,24.6283);' +
    'way["leisure"~"^(park|garden|pitch)$"](48.6042,24.5306,48.6634,24.6283);' +
    ');out geom;';

  function roadStyle(h) {
    if (/^(trunk|primary)/.test(h)) return { color: '#ffffff', weight: 9, casing: '#8f8f8f', casingWeight: 11.5 };
    if (/^(secondary|tertiary)/.test(h)) return { color: '#ffffff', weight: 7, casing: '#9a9a9a', casingWeight: 9.5 };
    if (/^(residential|unclassified|living_street)/.test(h)) return { color: '#ffffff', weight: 5, casing: '#a6a6a6', casingWeight: 7 };
    return { color: '#ffffff', weight: 3, casing: '#b5b5b5', casingWeight: 4.8 };
  }

  // Якщо дані у форматі GeoJSON (FeatureCollection), перетворюємо їх на формат Overpass
  function normalizeData(data) {
    if (data && data.elements) return data;
    var els = [];
    var feats = (data && data.features) || [];
    feats.forEach(function (f) {
      if (!f.geometry) return;
      var props = f.properties || {};
      var tags = props.tags ? props.tags : props;
      var lines = [];
      if (f.geometry.type === 'LineString') lines.push(f.geometry.coordinates);
      else if (f.geometry.type === 'MultiLineString') lines = f.geometry.coordinates;
      else if (f.geometry.type === 'Polygon') lines.push(f.geometry.coordinates[0]);
      else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(function (p) { lines.push(p[0]); });
      lines.forEach(function (coords) {
        els.push({
          type: 'way',
          tags: tags,
          geometry: coords.map(function (c) { return { lon: c[0], lat: c[1] }; })
        });
      });
    });
    return { elements: els };
  }

  function drawBase(data) {
    data = normalizeData(data);
    var areas = L.layerGroup();
    var water = L.layerGroup();
    var casings = L.layerGroup();
    var roads = L.layerGroup();
    var labels = L.layerGroup();
    var usedNames = {};

    data.elements.forEach(function (el) {
      if (el.type !== 'way' || !el.geometry) return;
      var pts = el.geometry.map(function (g) { return [g.lat, g.lon]; });
      var t = el.tags || {};

      if (t.highway) {
        var st = roadStyle(t.highway);
        L.polyline(pts, { renderer: baseCanvas, pane: 'basePane', color: st.casing, weight: st.casingWeight, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(casings);
        L.polyline(pts, { renderer: baseCanvas, pane: 'basePane', color: st.color, weight: st.weight, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(roads);

        var name = t['name:uk'] || t.name;
        if (name && pts.length > 1) {
          var key = name + '|' + Math.round(pts[0][0] * 200) + '|' + Math.round(pts[0][1] * 200);
          if (!usedNames[key]) {
            usedNames[key] = true;
            var mi = Math.floor(pts.length / 2);
            var mid = pts[mi];
            var pa = pts[Math.max(0, mi - 1)];
            var pb = pts[Math.min(pts.length - 1, mi + 1)];
            var p1 = map.project(L.latLng(pa[0], pa[1]), 17);
            var p2 = map.project(L.latLng(pb[0], pb[1]), 17);
            var angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
            if (angle > 90) angle -= 180;
            if (angle < -90) angle += 180;
            L.marker(mid, {
              pane: 'roadLabelsPane',
              interactive: false,
              icon: L.divIcon({ className: 'road-label', html: '<span style="display:inline-block;transform:translate(-50%,-50%) rotate(' + angle.toFixed(1) + 'deg);white-space:nowrap;">' + name + '</span>', iconSize: [0, 0] })
            }).addTo(labels);
          }
        }
      } else if (t.waterway) {
        L.polyline(pts, { renderer: baseCanvas, pane: 'basePane', color: '#a9d3e8', weight: t.waterway === 'river' ? 6 : 3, opacity: 1, lineCap: 'round', interactive: false }).addTo(water);
      } else if (t.natural === 'water') {
        L.polygon(pts, { renderer: baseCanvas, pane: 'basePane', color: '#a9d3e8', weight: 1, fillColor: '#bfe0ef', fillOpacity: 1, interactive: false }).addTo(water);
      } else {
        var green = (t.natural === 'wood' || t.landuse === 'forest');
        L.polygon(pts, { renderer: baseCanvas, pane: 'basePane', color: green ? '#cfe3c4' : '#dcebd3', weight: 0, fillColor: green ? '#d6e8cb' : '#e4f0dc', fillOpacity: 1, interactive: false }).addTo(areas);
      }
    });

    areas.addTo(customBase);
    water.addTo(customBase);
    casings.addTo(customBase);
    roads.addTo(customBase);
    labels.addTo(customBase);
  }

  // Спершу пробуємо швидкий локальний файл nadvirna-roads.json (лежить поруч з index.html).
  // Якщо його немає — завантажуємо з Overpass, як і раніше.
  function loadFromFileOrOverpass() {
    statusBox.style.display = 'block';
    statusBox.textContent = 'Завантажую вулиці…';
    // 1) пам'ять браузера (якщо вже відкривали карту раніше)
    try {
      var cached = localStorage.getItem('nadvirna-base-v1');
      if (cached) {
        drawBase(JSON.parse(cached));
        customLoaded = true;
        statusBox.style.display = 'none';
        return;
      }
    } catch (e) {}
    // 2) локальний файл поруч з index.html, якщо він є; 3) інакше Overpass
    fetch('nadvirna-roads.json')
      .then(function (r) { if (!r.ok) throw new Error('no file'); return r.json(); })
      .then(function (data) {
        drawBase(data);
        customLoaded = true;
        statusBox.style.display = 'none';
      })
      .catch(function () { loadCustomBase(0); });
  }

  function loadCustomBase(serverIndex) {
    serverIndex = serverIndex || 0;
    if (serverIndex >= overpassServers.length) {
      statusBox.textContent = 'Не вдалося завантажити вулиці. Спробуйте оновити сторінку.';
      return;
    }
    statusBox.style.display = 'block';
    statusBox.textContent = 'Завантажую вулиці…';
    fetch(overpassServers[serverIndex], {
      method: 'POST',
      body: 'data=' + encodeURIComponent(overpassQuery)
    })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        drawBase(data);
        customLoaded = true;
        statusBox.style.display = 'none';
        try { localStorage.setItem('nadvirna-base-v1', JSON.stringify(data)); } catch (e) {}
      })
      .catch(function () { loadCustomBase(serverIndex + 1); });
  }

  // Світле тло: кольором самого контейнера карти, щоб воно не перекривало лінії
  var ownMap = customBase;

  osm.addTo(map);
  L.control.layers({ 'Карта': osm, 'Своя карта (без будівель)': ownMap, 'Супутник': satellite }, null, { collapsed: false }).addTo(map);

  map.on('baselayerchange', function (e) {
    if (e.layer === ownMap) {
      document.getElementById('map').style.background = '#f1f0ec';
      if (!customLoaded) loadFromFileOrOverpass();
    } else {
      document.getElementById('map').style.background = '';
    }
  });

  map.on('click', function (e) {
    document.getElementById('coords-box').textContent =
      e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
  });

  // ============ РАЙОНИ ============
  // Щоб додати район, скопіюй один рядок нижче, зміни назву, координати
  // і кут нахилу напису (0 = прямо, від'ємне число = нахил вгору). Не забудь кому в кінці рядка.
  // Формат рядка: ['Назва', [широта, довгота], кут],
  var districts = [
    ['Річки', [48.647612, 24.589323], -20],
    // ['Новий район', [48.630000, 24.570000], 0],
  ];
  // ================================

  districts.forEach(function (d) {
    L.marker(d[1], {
      icon: L.divIcon({
        className: 'district-label',
        html: '<span style="display:inline-block;transform:rotate(' + (d[2] || 0) + 'deg);white-space:nowrap;">' + d[0] + '</span>',
        iconSize: [100, 30]

      interactive: false,
      pane: 'districtsPane'
    }).addTo(map);
  });

  var photoOld = '848570233_122132469422881327_7963786196056815321_n.jpg';

      html: '<img src="' + photoNew + '">',

      '<img src="' + photoNew + '" style="width:300px"><br>' +
      '<img src="' + photoOld + '" style="width:300px">'
    );

  var streets = [

    ["Дем'янчука", [48.622229, 24.575289], ['Пархоменка', 'Glinianska (Глинянська ???)']],
    ['Добровольців', [48.613323, 24.579932], ['Комарова', 'Tartaczna (Тартачна)']],

    ['Свідруків М. і М.', [48.625059, 24.570027], ["Воз'єднання"]]
  ];

  var pinHtml =
    '<div class="pin-wrap">' +
      '<div class="pin-shadow"></div>' +
      '<div class="pin-glass"></div>' +
      '<svg class="pin-outline" viewBox="0 0 28 38">' +
        '<polygon points="2,2 26,2 14,36" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>' +
        '<polygon points="2,2 26,2 14,36" fill="none" stroke="#1E50A0" stroke-width="2" stroke-linejoin="round"/>' +
      '</svg>' +
    '</div>';

  streets.forEach(function (s) {
    var olds = s[2].length ? '<br>Раніше: ' + s[2].join('; ') : '';
    L.marker(s[1], {
      pane: 'streetsPane',
      icon: L.divIcon({
        className: '',
        html: pinHtml,
        iconSize: [28, 42],
        iconAnchor: [14, 39]
      })
    })
      .addTo(map)
      .bindTooltip(s[0], { direction: 'top', offset: [0, -36] })
      .bindPopup('<b>' + s[0] + '</b>' + olds, { offset: [0, -34] });
  });
</script>

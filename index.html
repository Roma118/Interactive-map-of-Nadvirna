<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Надвірної</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body { margin: 0; font-family: sans-serif; }
  #map { height: 100vh; width: 100%; }

  .street-label {
    background: white;
    color: #8B0000;
    border: 2px solid #8B0000;
    border-radius: 6px;
    padding: 0 4px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    text-align: center;
    cursor: pointer;
  }

  .photo-icon img {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    cursor: pointer;
  }

  .leaflet-popup-content { font-size: 18px; }

  .district-label::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 100px;
    transform: translate(-50%, -50%);
    background: #F0DC82;
    border-radius: 50%;
    filter: blur(20px);
    z-index: -1;
  }

  .district-label {
    font-size: 28px;
    font-weight: bold;
    color: #8B0000;
    text-shadow: 0 0 4px #F0DC82, 0 0 8px #F0DC82, 0 0 120px #F0DC82, 0 0 6px #F0DC82, 0 0 12px #F0DC82, 0 0 20px #F0DC82, 0 0 200px #F0DC82;
    text-align: center;
  }

  .rivers span { transform: rotate(-20deg); }

  #coords-box {
    position: absolute;
    left: 10px;
    bottom: 30px;
    z-index: 1000;
    background: white;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 16px;
    user-select: all;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="coords-box">Клікни на мапі, щоб побачити координати</div>

<script>
  var map = L.map('map', {
    maxBounds: [[48.60419836040843, 24.530568289659303], [48.66336565863335, 24.62824772042684]],
    maxBoundsViscosity: 1.0,
    minZoom: 12
  }).setView([48.6333, 24.5833], 14);

  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; учасники OpenStreetMap'
  });

  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Знімки &copy; Esri'
  });

  osm.addTo(map);
  L.control.layers({ 'Карта': osm, 'Супутник': satellite }).addTo(map);

  map.on('click', function (e) {
    document.getElementById('coords-box').textContent =
      e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
  });

  L.marker([48.64806241374767, 24.588595111519023], {
    icon: L.divIcon({
      className: 'district-label rivers',
      html: '<span>Річки</span>',
      iconSize: [100, 30]
    }),
    interactive: false
  }).addTo(map);

  var photoNew = '850370192_122132470694881327_637810224935811712_n.jpg';
  var photoOld = '848570233_122132469422881327_7963786196056815321_n.jpg';

  L.marker([48.634021863367984, 24.570932457481078], {
    icon: L.divIcon({
      className: 'photo-icon',
      html: '<img src="' + photoNew + '">',
      iconSize: [30, 30]
    })
  }).addTo(map)
    .bindPopup(
      '<img src="' + photoNew + '" style="width:300px"><br>' +
      '<img src="' + photoOld + '" style="width:300px">'
    );

  var streets = [
    ['Козацька', [48.637978, 24.567082], ['Щорса', 'Potockiego (Потоцького)']],
    ['Богуна І.', [48.636067, 24.552657], ['Горєлова', 'Mokotowska (Молодківська)']],
    ['Великого В.', [48.636092, 24.555548], ['Челюскінців', 'Sw. Wlodzimierza (Св. Володимира)']],
    ['Вітовського Д.', [48.626477, 24.555527], ['Жукова, пров.', 'Podzamcze (Підзамче)']],
    ['Грушевського М.', [48.629562, 24.559293], ['Маркса К.', 'Pilsudskiego (Пілсудського)', 'Żwirki i Wigury (Жвіркі і Віґури)']],
    ["Дем'янчука", [48.622229, 24.575289], ['Пархоменка', 'Glinianska (Глинянська ???)']],
    ['Добровольців', [48.613264, 24.579967], ['Комарова', 'Tartaczna (Тартачна)']],
    ['Коперніка М.', [48.629377, 24.564282], ['Kopernika (Коперника)']],
    ['Котляревського', [48.634554, 24.563413], ['Ковпака', 'Kotlarewskiego (Котляревського)']],
    ['Крушельницької', [48.636120, 24.562351], ['Червоноармійська', 'Sokola (Сокола)']],
    ['Мазепи Г.', [48.64350096532669, 24.575589759261074], ['1-го Травня', '3-го Травня (3 Maja)', 'Станіславівська']],
    ['Лисенка М.', [48.631175, 24.569110], ['Lysenki (Лисенка)']],
    ['Семена Височана', [48.645911, 24.581056], ['Ворошилова', 'Nowa (Нова)']],
    ['Міцькевича', [48.634398, 24.570472], ['Mickiewicza (Міцькевича)']],
    ['Недовга', [48.628516, 24.560859], ['Дунаєва', 'Niedługa (Недовга)']],
    ['Ольги Кн.', [48.636315, 24.566666], ['Жовтневої революції', 'Sw. Michala (Св. Михайла)']],
    ['Петрушевича', [48.634698, 24.569507], ['Чкалова', 'Piekarska (Пекарська)']],
    ['Пчілки О.', [48.622045, 24.570816], ['Смеречук О.', 'Ogrodowa (Городня)']],
    ['Сагайдачного', [48.636496, 24.558917], ['Фрунзе', 'Tkacka (Ткацька)']],
    ['Січових Стрільців', [48.627328, 24.568187], ['40-річчя Жовтня', 'Cmentarna (Цвинтарна)']],
    ['Соборна', [48.619860, 24.573841], ['Леніна', 'Mandyczewskiego (Мандичевського)']],
    ['Степанівни О.', [48.627200, 24.559722], ['Осипенко П.', 'Sobieskiego (Собеського)']],
    ['Федьковича Ю.', [48.627945, 24.564056], ['Fedkowicza (Федьковича)']],
    ['Франка І.', [48.638283, 24.571738], ['Mazepy (Мазепи)']],
    ['Хмельницького Б.', [48.645698, 24.579828], ['Chmielnickiego (Хмельницького)']],
    ['Чорновола', [48.633008, 24.568992], ['Перемоги, пл.', 'Dr. Herzla (Др. Херзла)', 'Mościskiego (Мосцицького)']],
    ['Шашкевича', [48.627723, 24.574297], ['Szaszkiewicza (Шашкевича)']],
    ['Шевченка майд.', [48.633902, 24.566867], ['Гагаріна', 'Мендєлєєва', 'Староруська', 'Леніна пл.', 'Pierackiego (Піратського)']],
    ['Шевченка Т.', [48.629543, 24.576211], ['Szewczenki (Шевченка)']],
    ['Шептицького', [48.630838, 24.566103], ['Калініна', 'Kilińskiego (Кілінського)']],
    ['Шухевича', [48.649870, 24.583459], ['Тельмана', 'Targowa (Торгова)']]
  ];

  streets.forEach(function (s) {
    var olds = s[2].length ? '<br>Раніше: ' + s[2].join('; ') : '';
    L.marker(s[1], {
      icon: L.divIcon({
        className: 'street-label',
        html: s[0],
        iconSize: [90, 20]
      })
    }).addTo(map).bindPopup('<b>' + s[0] + '</b>' + olds);
  });
</script>

</body>
</html>

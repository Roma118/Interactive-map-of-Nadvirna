<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Надвірної</title>

<!-- Підключаємо Leaflet: стилі й сам скрипт -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body { margin: 0; font-family: sans-serif; }
  #map { height: 100vh; width: 100%; }

  .street-label {
    background: white;
    color: #8B0000;
    border: 2px solid #8B0000;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
    text-align: center;
    cursor: pointer;
  }

  .photo-icon img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    cursor: pointer;
  }

  .leaflet-popup-content { font-size: 18px; }

  .district-label::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 100px;
    transform: translate(-50%, -50%);
    background: #F0DC82;
    border-radius: 50%;
    filter: blur(20px);
    z-index: -1;
  }

  .district-label {
    font-size: 28px;
    font-weight: bold;
    color: #8B0000;
    text-shadow: 0 0 4px #F0DC82, 0 0 8px #F0DC82, 0 0 120px #F0DC82, 0 0 6px #F0DC82, 0 0 12px #F0DC82, 0 0 20px #F0DC82, 0 0 200px #F0DC82;
    text-align: center;
  }

  .rivers span { transform: rotate(-20deg); }
</style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Створюємо карту й центруємо її на Надвірній
  var map = L.map('map', {
    maxBounds: [[48.60419836040843, 24.530568289659303], [48.66336565863335, 24.62824772042684]],
    maxBoundsViscosity: 1.0,
    minZoom: 12
  }).setView([48.6333, 24.5833], 14);

  // Звичайна карта
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; учасники OpenStreetMap'
  });

  // Супутник (знімки Esri)
  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Знімки &copy; Esri'
  });

  // Показуємо звичайну карту при відкритті
  osm.addTo(map);

  // Кнопка-перемикач у правому верхньому куті
  L.control.layers({ 'Карта': osm, 'Супутник': satellite }).addTo(map);

  // Район Річки
  L.marker([48.64806241374767, 24.588595111519023], {
    icon: L.divIcon({
      className: 'district-label rivers',
      html: '<span>Річки</span>',
      iconSize: [100, 30]
    }),
    interactive: false
  }).addTo(map);

  // Вулиця Мазепи з історичними назвами
  L.marker([48.64350096532669, 24.575589759261074], {
    icon: L.divIcon({
      className: 'street-label',
      html: 'вул. Мазепи',
      iconSize: [100, 30]
    })
  }).addTo(map)
    .bindPopup('<b>вул. Гетьмана Івана Мазепи</b><br>Раніше: 1-го Травня, 3-го Травня (3 Maja), Станіславівська');

  // Фото «колись і тепер»
  var photoNew = '850370192_122132470694881327_637810224935811712_n.jpg';
  var photoOld = '848570233_122132469422881327_7963786196056815321_n.jpg';

  L.marker([48.634021863367984, 24.570932457481078], {
    icon: L.divIcon({
      className: 'photo-icon',
      html: '<img src="' + photoNew + '">',
      iconSize: [60, 60]
    })
  }).addTo(map)
    .bindPopup(
      '<img src="' + photoNew + '" style="width:300px"><br>' +
      '<img src="' + photoOld + '" style="width:300px">'
    );
</script>

</body>
</html>
